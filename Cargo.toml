[package]
name = "tool"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Native copy-on-write Git workspaces"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8"
tempfile = "3"
toml = "0.8"
xattr = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

